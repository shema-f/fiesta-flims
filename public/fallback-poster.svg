<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="ambientGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#ff4500" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#ff2200" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bottomGlow" cx="50%" cy="95%" r="50%">
      <stop offset="0%" stop-color="#ff3b00" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#050608" stop-opacity="0" />
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="28" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Fiery Orange Gradients -->
    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18" />
      <stop offset="50%" stop-color="#ff4a11" />
      <stop offset="100%" stop-color="#e82900" />
    </linearGradient>

    <linearGradient id="logoF" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff841f" />
      <stop offset="100%" stop-color="#ea3904" />
    </linearGradient>

    <linearGradient id="flixText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#ff9078" />
      <stop offset="100%" stop-color="#ff6048" />
    </linearGradient>
  </defs>

  <!-- Deep cinematic background -->
  <rect width="800" height="1200" fill="#08090d" />
  <rect width="800" height="1200" fill="url(#ambientGlow)" />
  <rect width="800" height="1200" fill="url(#bottomGlow)" />

  <!-- Subtle Film Texture Dots / Ember Light -->
  <g opacity="0.15" fill="#ff7a18">
    <circle cx="120" cy="180" r="1.5" />
    <circle cx="680" cy="240" r="2" />
    <circle cx="210" cy="850" r="1.5" />
    <circle cx="620" cy="920" r="2.5" />
    <circle cx="390" cy="150" r="1" />
    <circle cx="140" cy="1060" r="1.5" />
    <circle cx="720" cy="1080" r="2" />
    <circle cx="450" cy="1130" r="1.5" />
  </g>

  <!-- Glowing Neon Outer Border Frame -->
  <rect 
    x="36" 
    y="40" 
    width="728" 
    height="1120" 
    rx="42" 
    fill="none" 
    stroke="#ff4a11" 
    stroke-width="3" 
    stroke-opacity="0.85" 
    filter="url(#subtleGlow)" 
  />

  <!-- ================= CENTER CLAPPERBOARD WITH FILM REEL ================= -->
  <g transform="translate(400, 370)" filter="url(#neonGlow)">
    <!-- Main Clapper Body (Bottom Slate) -->
    <rect 
      x="-155" 
      y="-40" 
      width="310" 
      height="225" 
      rx="32" 
      fill="none" 
      stroke="url(#neonOrange)" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />

    <!-- Film Reel inside slate -->
    <g transform="translate(0, 72)">
      <!-- Outer Reel Rim -->
      <circle 
        cx="0" 
        cy="0" 
        r="64" 
        fill="none" 
        stroke="url(#neonOrange)" 
        stroke-width="16" 
      />
      <!-- Center Hub -->
      <circle 
        cx="0" 
        cy="0" 
        r="18" 
        fill="none" 
        stroke="url(#neonOrange)" 
        stroke-width="14" 
      />
      <!-- 5 Reel Cutout Holes -->
      <circle cx="0" cy="-36" r="8.5" fill="none" stroke="url(#neonOrange)" stroke-width="10" />
      <circle cx="34" cy="-11" r="8.5" fill="none" stroke="url(#neonOrange)" stroke-width="10" />
      <circle cx="21" cy="30" r="8.5" fill="none" stroke="url(#neonOrange)" stroke-width="10" />
      <circle cx="-21" cy="30" r="8.5" fill="none" stroke="url(#neonOrange)" stroke-width="10" />
      <circle cx="-34" cy="-11" r="8.5" fill="none" stroke="url(#neonOrange)" stroke-width="10" />
    </g>

    <!-- Angled Top Clapper Stick (Opened at ~18 degrees) -->
    <g transform="translate(-150, -48) rotate(-16)">
      <!-- Clapper stick body -->
      <rect 
        x="0" 
        y="-54" 
        width="315" 
        height="54" 
        rx="22" 
        fill="none" 
        stroke="url(#neonOrange)" 
        stroke-width="20" 
        stroke-linecap="round"
      />
      <!-- 3 Diagonal Stripe Marks -->
      <line x1="75" y1="-50" x2="105" y2="-4" stroke="url(#neonOrange)" stroke-width="16" stroke-linecap="round" />
      <line x1="150" y1="-50" x2="180" y2="-4" stroke="url(#neonOrange)" stroke-width="16" stroke-linecap="round" />
      <line x1="225" y1="-50" x2="255" y2="-4" stroke="url(#neonOrange)" stroke-width="16" stroke-linecap="round" />
    </g>

    <!-- Small Hinge Joint on Left -->
    <circle cx="-146" cy="-44" r="10" fill="url(#neonOrange)" />
  </g>

  <!-- ================= FIESTA FLIX LOGO + BRANDING ================= -->
  <g transform="translate(135, 665)">
    <!-- Stylized Glowing 'F' Icon -->
    <g transform="translate(0, 0)">
      <path 
        d="M 12 0 L 58 0 C 66 0 72 6 72 14 L 72 20 C 72 26 66 32 58 32 L 32 32 L 32 46 L 52 46 C 58 46 64 51 64 57 L 64 61 C 64 67 58 72 52 72 L 32 72 L 32 94 C 32 102 26 108 18 108 L 12 108 C 5 108 0 102 0 94 L 0 14 C 0 6 5 0 12 0 Z" 
        fill="url(#logoF)" 
        filter="url(#subtleGlow)" 
      />
      <!-- Fold highlight on F top -->
      <path 
        d="M 12 0 L 58 0 C 66 0 72 6 72 14 L 38 42 L 18 42 C 6 42 0 34 0 22 L 0 14 C 0 6 5 0 12 0 Z" 
        fill="#ff9e3b" 
        opacity="0.4" 
      />
    </g>

    <!-- Wordmark: "Fiesta" in solid white, "Flix" in gradient coral -->
    <g transform="translate(100, 80)">
      <text 
        x="0" 
        y="0" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" 
        font-size="94" 
        font-weight="900" 
        letter-spacing="-1.5"
      >
        <tspan fill="#ffffff">Fiesta</tspan>
        <tspan fill="url(#flixText)">Flix</tspan>
      </text>
    </g>
  </g>

  <!-- Rwandan Cinema Subtext -->
  <text 
    x="400" 
    y="795" 
    text-anchor="middle" 
    fill="#858a98" 
    font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" 
    font-size="20" 
    font-weight="700" 
    letter-spacing="5"
  >
    RWANDAN CINEMA &amp; AGASOBANUYE
  </text>
</svg>
